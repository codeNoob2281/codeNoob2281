name: generate snake animation

on:
  # refresh the snake once a day
  schedule:
    - cron: "0 0 * * *"

  # allow manual runs from the Actions tab
  workflow_dispatch:

  # regenerate whenever the profile README changes
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # generate the animated svg from the contribution graph
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # publish dist/ to the "output" branch, so it is reachable at
      # https://raw.githubusercontent.com/<owner>/<repo>/output/<file>
      - name: push svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
